name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java classes
      run: javac Decorator-Design-Pattern/src/com/callisto/notification/*.java

    - name: Run OrderService (Verify Output)
      run: java -cp Decorator-Design-Pattern/src com.callisto.notification.OrderService
